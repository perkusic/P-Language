<svg xmlns="http://www.w3.org/2000/svg" width="900" height="607.5" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Manufacturing cell: one shared transfer zone</title>
<desc id="desc">Alternating arm / AGV access · technician intervenes at the stand · robot maintenance excluded</desc>
<style>svg{font-family:Arial,Helvetica,sans-serif;--bg:#ffffff;--ink:#162d40;--muted:#526575;--line:#c4d0d8;--blue:#286bc0;--tint:#edf4fc;--green:#23794f;--green-bg:#edf8f1;--amber:#95550a;--amber-bg:#fff5e5;background:var(--bg)}@media(prefers-color-scheme:dark){svg{--bg:#1b1a18;--ink:#ecebe7;--muted:#b5b4ae;--line:#65655f;--blue:#82b4ff;--tint:#233141;--green:#7ad29d;--green-bg:#21372a;--amber:#efbd73;--amber-bg:#3b2e1d}}</style>
<defs>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--blue)"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--muted)"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--green)"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--amber)"/></marker>
</defs>
<rect width="1600" height="1080" fill="var(--bg)"/>
<text x="45" y="66" fill="var(--ink)" font-size="36" font-weight="700" text-anchor="start">Manufacturing cell: one shared transfer zone</text>
<text x="45" y="110" fill="var(--muted)" font-size="23" font-weight="400" text-anchor="start">Alternating arm / AGV access · technician intervenes at the stand · robot maintenance excluded</text>
<rect x="40" y="150" width="1020" height="785" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<rect x="1090" y="150" width="470" height="785" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<text x="65" y="195" fill="var(--ink)" font-size="22" font-weight="700" text-anchor="start">PHYSICAL INTERPRETATION</text>
<text x="1115" y="195" fill="var(--ink)" font-size="22" font-weight="700" text-anchor="start">LOGICAL REGULATION</text>
<rect x="450" y="340" width="405" height="260" rx="15" fill="var(--tint)" stroke="var(--blue)" stroke-width="2" stroke-dasharray="10 7"/>
<text x="652" y="380" fill="var(--blue)" font-size="26" font-weight="700" text-anchor="middle">Resource 0: transfer zone</text>
<text x="652" y="416" fill="var(--ink)" font-size="23" font-weight="400" text-anchor="middle">Capacity 1: arm OR AGV</text>
<rect x="570" y="452" width="165" height="89" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<text x="652" y="487" fill="var(--ink)" font-size="23" font-weight="700" text-anchor="middle">Fixed stand</text>
<text x="652" y="520" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="middle">part / pallet</text>
<circle cx="165" cy="470" r="36" fill="var(--line)"/><path d="M165,470 L260,405 L340,448" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<text x="165" y="540" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="middle">Fixed base</text>
<text x="165" y="574" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="middle">outside resource 0</text>
<text x="280" y="635" fill="var(--ink)" font-size="22" font-weight="400" text-anchor="middle">Retracted moving parts</text>
<text x="280" y="665" fill="var(--muted)" font-size="20" font-weight="400" text-anchor="middle">also outside the blue boundary</text>
<path d="M350,450 L540,450" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#arr-blue)" stroke-dasharray="9 7"/>
<text x="100" y="310" fill="var(--blue)" font-size="21" font-weight="400" text-anchor="start">Dashed reach: only with its own reservation</text>
<g transform="translate(760 240)" stroke="var(--green)" stroke-width="4" fill="none" stroke-linecap="round"><circle cy="-28" r="13"/><path d="M0,-15 V24 M-22,3 H22 M0,24 L-20,51 M0,24 L20,51"/></g>
<path d="M760,300 L760,329" fill="none" stroke="var(--green)" stroke-width="3" marker-end="url(#arr-green)"/>
<text x="500" y="239" fill="var(--green)" font-size="23" font-weight="700" text-anchor="start">Technician</text>
<text x="500" y="270" fill="var(--green)" font-size="20" font-weight="400" text-anchor="start">After notification</text>
<rect x="470" y="705" width="550" height="115" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2" stroke-dasharray="10 7"/>
<rect x="600" y="735" width="110" height="56" rx="15" fill="var(--tint)" stroke="var(--blue)" stroke-width="2"/>
<text x="655" y="772" fill="var(--blue)" font-size="25" font-weight="700" text-anchor="middle">AGV</text>
<text x="920" y="748" fill="var(--ink)" font-size="22" font-weight="600" text-anchor="middle">External route</text>
<text x="920" y="782" fill="var(--muted)" font-size="20" font-weight="400" text-anchor="middle">supply / collection</text>
<text x="650" y="856" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="middle">Holding point outside resource 0</text>
<path d="M655,700 L655,615" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="500" y="680" fill="var(--blue)" font-size="20" font-weight="400" text-anchor="start">in, with grant</text>
<path d="M810,615 L810,697" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="860" y="662" fill="var(--blue)" font-size="20" font-weight="400" text-anchor="start">out</text>
<text x="65" y="902" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="start">Use shown as alternatives: AGV clears the zone before the arm enters, and conversely.</text>
<rect x="1115" y="235" width="420" height="155" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<text x="1137" y="272" fill="var(--ink)" font-size="25" font-weight="700" text-anchor="start">Admission controller</text>
<text x="1137" y="305" fill="var(--blue)" font-size="21" font-weight="400" text-anchor="start">ResourceGuard</text>
<text x="1137" y="340" fill="var(--muted)" font-size="19" font-weight="400" text-anchor="start">Exclusive reservation; grant / deny</text>
<text x="1137" y="368" fill="var(--muted)" font-size="19" font-weight="400" text-anchor="start">Release only after confirmed clearance</text>
<rect x="1115" y="445" width="420" height="155" rx="15" fill="var(--tint)" stroke="var(--blue)" stroke-width="2"/>
<text x="1137" y="482" fill="var(--ink)" font-size="25" font-weight="700" text-anchor="start">Adaptation coordinator</text>
<text x="1137" y="515" fill="var(--blue)" font-size="21" font-weight="400" text-anchor="start">AdaptationCoordinator</text>
<text x="1137" y="550" fill="var(--muted)" font-size="19" font-weight="400" text-anchor="start">Block → drain → acknowledge → commit</text>
<text x="1137" y="578" fill="var(--muted)" font-size="19" font-weight="400" text-anchor="start">Notification may precede installation</text>
<rect x="1115" y="655" width="420" height="155" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<text x="1137" y="692" fill="var(--ink)" font-size="25" font-weight="700" text-anchor="start">Organization</text>
<text x="1137" y="725" fill="var(--blue)" font-size="21" font-weight="400" text-anchor="start">ObligationManager</text>
<text x="1137" y="760" fill="var(--muted)" font-size="19" font-weight="400" text-anchor="start">Abstract jobs and deadlines</text>
<text x="1137" y="788" fill="var(--muted)" font-size="19" font-weight="400" text-anchor="start">Sanction event; no physical penalty</text>
<text x="1325" y="865" fill="var(--muted)" font-size="20" font-weight="400" text-anchor="middle">P model: no motion or sensor simulation</text>
<text x="45" y="986" fill="var(--ink)" font-size="23" font-weight="400" text-anchor="start">Empty means no AGV body or robot moving parts in resource 0. The stand and material are not agents.</text>
<text x="45" y="1025" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="start">Paths, clearance confirmation, battery charging and physical energy isolation are outside the baseline model.</text>
</svg>