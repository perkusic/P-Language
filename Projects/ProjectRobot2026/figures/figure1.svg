<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 527" role="img" aria-label="Robot fleet: shared space and regulation" font-size="13"><style>svg{--cds-text-primary:#0b0b0b;--cds-text-secondary:#52514e;--cds-chart-axis:#b5b4a8;--cds-chart-grid:#e1e0db;--cds-chart-reference-tint:#ededec;--cds-chart-categorical-1:#2a78d6;--cds-chart-categorical-2:#d9822b;--cds-chart-categorical-3:#7d5bc6;--cds-chart-status-warning:#e8a317;--cds-chart-status-good:#2e9d5b;--cds-chart-status-critical:#d14343;--cds-bg:#ffffff;background:var(--cds-bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#ecebe7;--cds-text-secondary:#a8a49c;--cds-chart-axis:#6f6d65;--cds-chart-grid:#3a3833;--cds-chart-reference-tint:#2a2926;--cds-chart-categorical-1:#6aa5f0;--cds-chart-categorical-2:#f0a35e;--cds-chart-categorical-3:#a98cf0;--cds-chart-status-warning:#f0b23a;--cds-chart-status-good:#4cc27b;--cds-chart-status-critical:#f06a6a;--cds-bg:#1b1a18}}</style><g transform="scale(0.475) translate(0 -40)"><defs><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-status-good)"></path></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-categorical-1)"></path></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-text-secondary)"></path></marker><marker id="arrow-bay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--cds-chart-categorical-3)"></path></marker></defs><text x="60" y="111" fill="var(--cds-text-primary)" font-size="39" font-weight="700">Robot fleet: shared space and regulation</text><text x="60" y="156" fill="var(--cds-text-secondary)" font-size="23">Distributed admission · centralized adaptation and sanctioning</text><rect x="60" y="200" width="1015" height="830" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><rect x="1100" y="200" width="440" height="830" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="90" y="245" fill="var(--cds-text-secondary)" font-size="22" font-weight="700">PHYSICAL SYSTEM</text><text x="1130" y="245" fill="var(--cds-text-secondary)" font-size="22" font-weight="700">REGULATION</text><rect x="80" y="390" width="105" height="145" rx="8" fill="none" stroke-dasharray="6 6" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="132" y="420" fill="var(--cds-text-secondary)" font-size="20" font-weight="600" text-anchor="middle">Station</text><text x="132" y="442" fill="var(--cds-text-secondary)" font-size="20" font-weight="600" text-anchor="middle">A</text><rect x="98" y="470" width="70" height="46" rx="12" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="133" y="501" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="700" text-anchor="middle">R1</text><rect x="955" y="390" width="105" height="145" rx="8" fill="none" stroke-dasharray="6 6" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="1007" y="420" fill="var(--cds-text-secondary)" font-size="20" font-weight="600" text-anchor="middle">Station</text><text x="1007" y="442" fill="var(--cds-text-secondary)" font-size="20" font-weight="600" text-anchor="middle">B</text><rect x="973" y="470" width="70" height="46" rx="12" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="1008" y="501" fill="var(--cds-chart-categorical-1)" font-size="23" font-weight="700" text-anchor="middle">R2</text><rect x="225" y="390" width="225" height="145" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="337.5" y="425" fill="var(--cds-text-secondary)" font-size="25" font-weight="600" text-anchor="middle">Zone 0</text><rect x="455" y="390" width="225" height="145" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="567.5" y="425" fill="var(--cds-text-secondary)" font-size="25" font-weight="600" text-anchor="middle">Zone 1</text><rect x="685" y="390" width="225" height="145" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="797.5" y="425" fill="var(--cds-text-secondary)" font-size="25" font-weight="600" text-anchor="middle">Zone 2</text><path d="M452.5,390 V535 M682.5,390 V535" stroke="var(--cds-chart-status-warning)" stroke-width="3" stroke-dasharray="8 6"></path><path d="M187,462 L222,462" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><path d="M222,505 L187,505" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><path d="M913,462 L950,462" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><path d="M950,505 L913,505" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><text x="90" y="300" fill="var(--cds-chart-categorical-1)" font-size="21" font-weight="600">R1: A → 0 → 1 → 2 → B</text><text x="90" y="334" fill="var(--cds-chart-categorical-1)" font-size="21" font-weight="600">R2: B → 2 → 1 → 0 → A</text><g transform="translate(567 295)" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="4" stroke-linecap="round"><circle cy="-32" r="12"></circle><path d="M0,-19 V20 M-20,0 H20 M0,20 L-19,48 M0,20 L19,48"></path></g><text x="627" y="290" fill="var(--cds-text-primary)" font-size="22">Picker requests zone 1</text><path d="M567,350 L567,385" fill="none" stroke="var(--cds-chart-status-good)" stroke-width="3" marker-end="url(#arrow-good)"></path><path d="M295,538 L295,578" fill="none" stroke="var(--cds-chart-categorical-3)" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow-bay)"></path><rect x="240" y="582" width="110" height="56" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.08" stroke-dasharray="6 5" stroke="var(--cds-chart-categorical-3)" stroke-width="2"></rect><text x="295" y="617" fill="var(--cds-chart-categorical-3)" font-size="20" font-weight="600" text-anchor="middle">Bay 0</text><path d="M525,538 L525,578" fill="none" stroke="var(--cds-chart-categorical-3)" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow-bay)"></path><rect x="470" y="582" width="110" height="56" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.08" stroke-dasharray="6 5" stroke="var(--cds-chart-categorical-3)" stroke-width="2"></rect><text x="525" y="617" fill="var(--cds-chart-categorical-3)" font-size="20" font-weight="600" text-anchor="middle">Bay 1</text><path d="M755,538 L755,578" fill="none" stroke="var(--cds-chart-categorical-3)" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow-bay)"></path><rect x="700" y="582" width="110" height="56" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.08" stroke-dasharray="6 5" stroke="var(--cds-chart-categorical-3)" stroke-width="2"></rect><text x="755" y="617" fill="var(--cds-chart-categorical-3)" font-size="20" font-weight="600" text-anchor="middle">Bay 2</text><path d="M390,712 L390,545" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><rect x="230" y="718" width="215" height="72" rx="16" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="337" y="762" fill="var(--cds-chart-categorical-1)" font-size="21" font-weight="600" text-anchor="middle">Zone controller 0</text><path d="M620,712 L620,545" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><rect x="460" y="718" width="215" height="72" rx="16" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="567" y="762" fill="var(--cds-chart-categorical-1)" font-size="21" font-weight="600" text-anchor="middle">Zone controller 1</text><path d="M850,712 L850,545" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><rect x="690" y="718" width="215" height="72" rx="16" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="797" y="762" fill="var(--cds-chart-categorical-1)" font-size="21" font-weight="600" text-anchor="middle">Zone controller 2</text><text x="567" y="830" fill="var(--cds-text-secondary)" font-size="22" text-anchor="middle">Capacity: one robot per zone</text><rect x="90" y="860" width="44" height="26" rx="6" fill="none" stroke="var(--cds-text-primary)" stroke-width="2"></rect><text x="146" y="880" fill="var(--cds-text-secondary)" font-size="20">modeled as a P machine</text><rect x="410" y="860" width="44" height="26" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.08" stroke-dasharray="6 5" stroke="var(--cds-chart-categorical-3)" stroke-width="2"></rect><text x="466" y="880" fill="var(--cds-text-secondary)" font-size="20">assumption the results depend on (Section 7.6)</text><rect x="90" y="902" width="44" height="26" rx="6" fill="none" stroke-dasharray="6 6" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="146" y="922" fill="var(--cds-text-secondary)" font-size="20">physical context outside the verification scope</text><text x="90" y="975" fill="var(--cds-text-secondary)" font-size="20">Robots start outside the corridor and enter at its ends; a robot that gives up</text><text x="90" y="1002" fill="var(--cds-text-secondary)" font-size="20">leaves its zone into a side bay, modeled only as releasing the zone.</text><rect x="1125" y="300" width="390" height="152" rx="16" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="1150" y="344" fill="var(--cds-chart-categorical-1)" font-size="27" font-weight="700">Adaptation coordinator</text><text x="1150" y="389" fill="var(--cds-text-primary)" font-size="24">Prepare → drain → commit</text><text x="1150" y="426" fill="var(--cds-text-secondary)" font-size="22">Changes the norm set</text><path d="M1125,412 L1080,412" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="3" marker-end="url(#arrow-accent)"></path><text x="1125" y="492" fill="var(--cds-text-secondary)" font-size="22">Norms sent to zone</text><text x="1125" y="520" fill="var(--cds-text-secondary)" font-size="22">controllers</text><rect x="1125" y="575" width="390" height="152" rx="16" fill="none" stroke="var(--cds-chart-axis)" stroke-width="2"></rect><text x="1150" y="620" fill="var(--cds-text-primary)" font-size="28" font-weight="700">Fleet manager</text><text x="1150" y="662" fill="var(--cds-text-secondary)" font-size="23">Assigns tasks, tracks</text><text x="1150" y="694" fill="var(--cds-text-secondary)" font-size="23">deadlines, applies sanctions</text><text x="1320" y="785" fill="var(--cds-text-secondary)" font-size="22" font-weight="700" text-anchor="middle">CENTRAL COORDINATION</text><path d="M60,1068 H1540" stroke="var(--cds-chart-axis)" stroke-width="2"></path><text x="60" y="1106" fill="var(--cds-text-secondary)" font-size="22">Human entry requires a committed closure and an empty zone 1; physical faults, stations and bays are outside this model.</text><text x="567" y="480" fill="var(--cds-chart-status-good)" font-size="20" font-weight="600" text-anchor="middle">Picker enters</text><text x="567" y="506" fill="var(--cds-chart-status-good)" font-size="20" font-weight="600" text-anchor="middle">only after commit</text></g></svg>
