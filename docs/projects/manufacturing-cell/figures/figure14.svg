<svg xmlns="http://www.w3.org/2000/svg" width="900" height="506.25" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Logical closure is not physical energy isolation</title>
<desc id="desc">A partial conceptual comparison; the teaching model does not implement an industrial LOTO procedure</desc>
<style>svg{font-family:Arial,Helvetica,sans-serif;--bg:#ffffff;--ink:#162d40;--muted:#526575;--line:#c4d0d8;--blue:#286bc0;--tint:#edf4fc;--green:#23794f;--green-bg:#edf8f1;--amber:#95550a;--amber-bg:#fff5e5;background:var(--bg)}@media(prefers-color-scheme:dark){svg{--bg:#1b1a18;--ink:#ecebe7;--muted:#b5b4ae;--line:#65655f;--blue:#82b4ff;--tint:#233141;--green:#7ad29d;--green-bg:#21372a;--amber:#efbd73;--amber-bg:#3b2e1d}}</style>
<defs>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--blue)"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--muted)"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--green)"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--amber)"/></marker>
</defs>
<rect width="1600" height="900" fill="var(--bg)"/>
<text x="45" y="66" fill="var(--ink)" font-size="36" font-weight="700" text-anchor="start">Logical closure is not physical energy isolation</text>
<text x="45" y="110" fill="var(--muted)" font-size="23" font-weight="400" text-anchor="start">A partial conceptual comparison; the teaching model does not implement an industrial LOTO procedure</text>
<rect x="45" y="150" width="730" height="560" rx="15" fill="var(--tint)" stroke="var(--blue)" stroke-width="2"/>
<rect x="815" y="150" width="740" height="560" rx="15" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2"/>
<text x="75" y="198" fill="var(--blue)" font-size="26" font-weight="700" text-anchor="start">MODELED: ADMISSION COORDINATION</text>
<rect x="75" y="230" width="665" height="82" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<text x="95" y="263" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="start">Prepare</text>
<text x="95" y="294" fill="var(--muted)" font-size="22" font-weight="400" text-anchor="start">Stop granting new reservations</text>
<path d="M400,314 L400,330" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#arr-blue)"/>
<rect x="75" y="335" width="665" height="82" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<text x="95" y="368" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="start">Drain</text>
<text x="95" y="399" fill="var(--muted)" font-size="22" font-weight="400" text-anchor="start">Wait for current reservation to clear</text>
<path d="M400,419 L400,435" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#arr-blue)"/>
<rect x="75" y="440" width="665" height="82" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<text x="95" y="473" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="start">Acknowledge</text>
<text x="95" y="504" fill="var(--muted)" font-size="22" font-weight="400" text-anchor="start">No open agent reservation remains</text>
<path d="M400,524 L400,540" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#arr-blue)"/>
<rect x="75" y="545" width="665" height="82" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<text x="95" y="578" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="start">Commit / notify</text>
<text x="95" y="609" fill="var(--muted)" font-size="22" font-weight="400" text-anchor="start">Close admissions; requester may enter</text>
<text x="845" y="198" fill="var(--amber)" font-size="24" font-weight="700" text-anchor="start">OUTSIDE THE MODEL: PHYSICAL CONTROLS</text>
<rect x="845" y="230" width="675" height="82" rx="15" fill="var(--bg)" stroke="var(--amber)" stroke-width="2" stroke-dasharray="10 7"/>
<text x="865" y="263" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="start">Shutdown and energy isolation</text>
<text x="865" y="294" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="start">No energy-source state or isolating device</text>
<rect x="845" y="335" width="675" height="82" rx="15" fill="var(--bg)" stroke="var(--amber)" stroke-width="2" stroke-dasharray="10 7"/>
<text x="865" y="368" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="start">Personal locks / stored energy</text>
<text x="865" y="399" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="start">No lock ownership or energy-control mechanism</text>
<rect x="845" y="440" width="675" height="82" rx="15" fill="var(--bg)" stroke="var(--amber)" stroke-width="2" stroke-dasharray="10 7"/>
<text x="865" y="473" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="start">Physical verification</text>
<text x="865" y="504" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="start">No sensor proof of isolation or stop condition</text>
<rect x="845" y="545" width="675" height="82" rx="15" fill="var(--bg)" stroke="var(--amber)" stroke-width="2" stroke-dasharray="10 7"/>
<text x="865" y="578" fill="var(--ink)" font-size="24" font-weight="700" text-anchor="start">Release of physical controls</text>
<text x="865" y="609" fill="var(--muted)" font-size="21" font-weight="400" text-anchor="start">Logical reopening does not restart equipment</text>
<text x="45" y="770" fill="var(--ink)" font-size="25" font-weight="600" text-anchor="start">S1 checks conflicting occupancy; R3 checks committed closure before entry.</text>
<text x="45" y="816" fill="var(--muted)" font-size="22" font-weight="400" text-anchor="start">Neither establishes physical energy isolation. A stop does not itself empty resource 0 or complete L2.</text>
<text x="45" y="858" fill="var(--muted)" font-size="22" font-weight="400" text-anchor="start">Chosen scenario: intervention at the transfer stand; maintenance of the robot itself is excluded.</text>
</svg>